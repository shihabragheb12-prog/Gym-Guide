<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Guide — Day 2 & Day 3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#f5f7fa;font-family:Arial,Segoe UI,sans-serif}.app{max-width:1100px;margin:auto;padding:16px}.hero{padding:26px;border:1px solid #293746;border-radius:20px;background:linear-gradient(135deg,#152331,#0e151e)}h1{margin:4px 0;font-size:38px}.muted{color:#9aa9b8}.tabs{display:flex;gap:10px;margin:16px 0}.tab{border:1px solid #334454;background:#151e28;color:#b9c4cf;padding:11px 20px;border-radius:11px;font-weight:800}.tab.active{background:#145da0;color:#fff}.tab.red{background:#b42330;color:#fff}.card{background:#111922;border:1px solid #293746;border-radius:18px;overflow:hidden;margin-bottom:18px}.head{padding:15px 17px}.num{color:#8ea1b3;font-weight:800;font-size:12px}.name{font-size:22px;font-weight:900}.target{color:#9eb0c0;font-size:13px}.video{background:#05080c;padding:30px;text-align:center}.play{width:72px;height:72px;border-radius:50%;background:#f00;display:grid;place-items:center;margin:auto;font-size:30px}.watch{display:inline-block;margin-top:14px;background:#fff;color:#111;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 17px}.stat{background:#19232e;border-radius:11px;text-align:center;padding:10px}.stat b{display:block}.stat span{font-size:11px;color:#8d9aaa}.tip{padding:0 17px 16px;color:#c7d0d9;font-size:13px;line-height:1.5}.visual{margin:0 17px 17px;border-radius:14px;background:#080b0f;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:100%;min-height:220px;object-fit:contain;display:block}.nav{display:flex;gap:10px}.nav button{flex:1;padding:12px;border:1px solid #334454;background:#151e28;color:#fff;border-radius:10px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:20px}h1{font-size:32px}}
</style></head><body><div class="app"><div class="hero"><div class="muted">BEGINNER • FULL BODY</div><h1>GYM GUIDE</h1><div class="muted">Day 2 & Day 3 — General / Full Body</div></div><div class="tabs"><button class="tab active" onclick="setDay(2)">DAY 2</button><button class="tab" onclick="setDay(3)">DAY 3</button></div><div id="content"></div></div>
<script>
const D={2:[
["Leg Press","Quads / Glutes","CHPHn-OnTqE","Colossus Fitness","Keep your back against the pad and control the return."],
["Lat Pulldown","Lats / Upper Back","SALxEARiMkw","ATHLEAN-X","Pull toward the upper chest without swinging."],
["Machine Chest Press","Chest / Triceps","lRo9zZ7EwpM","NASM","Keep shoulders supported and control the return."],
["Lying Leg Curl","Hamstrings","lUH80pneL5w","NASM","Keep your hips on the pad and curl under control."],
["Dumbbell Shoulder Press","Shoulders / Triceps","vlFGTI5JzjI","Colossus Fitness","Keep your core tight and avoid excessive back arch."],
["Dumbbell Biceps Curl","Biceps","YKoMYY-YFso","6th Pillar Coaching","Keep elbows close and avoid swinging."],
["Rope Triceps Pushdown","Triceps","zfiYAzLecFg","BurakGTYM2","Keep elbows near your sides and control the way up."]
],3:[
["Incline Chest Press Machine","Upper Chest / Triceps","WFouNKmSbiI","Gymbro001","Keep your back supported and press under control."],
["Seated Cable Row","Back / Biceps","sP_4vybjVJs","Mind Pump TV","Keep your torso steady and pull toward your waist."],
["Smith Machine Squat","Quads / Glutes","BtfMX4WqUBo","Muscle & Strength","Start very light and focus on foot position and control."],
["Leg Extension Machine","Quads","6a-sO62TN5E","Exercise demo","Keep your back supported and raise/lower the pad slowly."],
["Dumbbell Lateral Raise","Side Delts","6a-sO62TN5E","Shelley Darlington","Use light dumbbells and raise with control to shoulder height."],
["Biceps Curl Machine","Biceps","x7YQw9JR48o","FIT.nl","Adjust the seat and keep the movement smooth."],
["Rope Triceps Pushdown","Triceps","zfiYAzLecFg","BurakGTYM2","Keep upper arms still and extend the elbows under control."]
]};
let day=2,i=0;
function render(){let a=D[day][i];document.querySelectorAll('.tab').forEach((b,n)=>{b.classList.remove('active','red');if(n===day-2){b.classList.add('active');if(day===3)b.classList.add('red')}});document.getElementById('content').innerHTML='<div class="muted" style="margin:8px 0 14px">DAY '+day+' • Exercise '+(i+1)+' of 7</div><div class="grid"><article class="card"><div class="head"><div class="num">0'+(i+1)+'</div><div class="name">'+a[0]+'</div><div class="target">'+a[1]+'</div></div><div class="video"><div class="play">▶</div><a class="watch" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+a[2]+'">Watch Video</a><div class="muted" style="font-size:11px;margin-top:9px">Video: '+a[3]+'</div></div><div class="stats"><div class="stat"><b>3</b><span>SETS</span></div><div class="stat"><b>10–12</b><span>REPS</span></div><div class="stat"><b>60–90 sec</b><span>REST</span></div></div><div class="tip"><b>Form tip:</b> '+a[4]+'</div></article><article class="card"><div class="head"><div class="num">VISUAL GUIDE</div><div class="name">START → END</div><div class="target">Movement reference</div></div><div class="visual"><img src="'+(day===3&&i===3?'https://www.shapesense.com/assets/img/exercise-videos/thumbnails/quads/leg-extension.jpg':'https://img.youtube.com/vi/'+a[2]+'/hqdefault.jpg')+'" alt="'+a[0]+' visual guide"></div><div class="tip">Use the video first, then match the START and END positions during the movement.</div></article></div><div class="nav"><button '+(i===0?'disabled':'')+' onclick="i--;render()">← Previous</button><button '+(i===6?'disabled':'')+' onclick="i++;render()">Next →</button></div>'}
function setDay(n){day=n;i=0;render()}render();
</script></body></html>
